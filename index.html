<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptogram UK</title>
    <!-- CryptoJS for client-side AES encryption -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        input, button { width: 100%; padding: 10px; box-sizing: border-box; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #0056b3; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #004085; }
        .btn-green { background-color: #28a745; }
        .btn-green:hover { background-color: #218838; }
        .btn-dark { background-color: #333; }
        .btn-dark:hover { background-color: #111; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 4px; overflow-x: auto; }
        .status { margin-top: 10px; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h2>Cryptogram UK</h2>

    <!-- STEP 1: PASSWORD PROMPT (Shown first) -->
    <div id="authSection">
        <div class="form-group">
            <label>Enter Passphrase to Unlock:</label>
            <input type="password" id="userPassphrase" placeholder="Passphrase">
        </div>
        <button onclick="unlockApp()">Unlock App</button>
        <div class="status" id="authStatus" style="color: red; margin-top: 10px;"></div>
    </div>

    <!-- MAIN APP INTERFACE (Completely hidden until unlocked) -->
    <div id="appSection" class="hidden">
        <div class="form-group">
            <label>Add Entry (Format: Name Amount):</label>
            <input type="text" id="tallyInput" placeholder="Alice 10">
        </div>

        <button onclick="addLocalEntry()">1. Add to Local List</button>
        <button class="btn-green" onclick="saveToGitHub()">2. Save to GitHub</button>
        <button class="btn-dark" onclick="fetchAndReveal()">Fetch & Reveal Database</button>

        <div class="status" id="statusText">Unlocked successfully.</div>

        <h3>Current Tally:</h3>
        <pre id="tallyDisplay">{}</pre>
    </div>

    <script>
        const CONFIG = {
            token: "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",
            repo: "mediaolit-hue/cryptogram"
        };

        const FILE_PATH = "tally_data.enc";
        let localTally = {};
        let currentSha = "";
        let activePassphrase = "";

        function logStatus(msg) {
            document.getElementById('statusText').innerText = msg;
        }

        // --- ENCRYPTION HELPERS ---
        function encryptData(dataObject, secretKey) {
            const jsonString = JSON.stringify(dataObject);
            return CryptoJS.AES.encrypt(jsonString, secretKey).toString();
        }

        function decryptData(ciphertext, secretKey) {
            try {
                const bytes = CryptoJS.AES.decrypt(ciphertext, secretKey);
                const decryptedString = bytes.toString(CryptoJS.enc.Utf8);
                return decryptedString ? JSON.parse(decryptedString) : null;
            } catch (e) {
                return null;
            }
        }

        // --- STEP 1: UNLOCK APP ---
        function unlockApp() {
            const pass = document.getElementById('userPassphrase').value.trim();
            
            if (pass !== "blackbird") {
                document.getElementById('authStatus').innerText = "Incorrect passphrase! Access denied.";
                return;
            }

            // Store the passphrase securely in memory for session use
            activePassphrase = pass;

            // Hide password prompt and reveal the app interface
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
        }

        // --- STEP 2: ADD LOCAL INPUT ---
        function addLocalEntry() {
            const input = document.getElementById('tallyInput').value.trim();
            if (!input) {
                alert("Please enter an entry like 'Alice 10'.");
                return;
            }

            const parts = input.split(/\s+/);
            const key = parts[0];
            const val = parseFloat(parts[1]);

            if (!key || isNaN(val)) {
                alert("Invalid format. Use format: NAME AMOUNT (e.g. Alice 10)");
                return;
            }

            localTally[key] = (localTally[key] || 0) + val;
            document.getElementById('tallyDisplay').innerText = JSON.stringify(localTally, null, 2);
            document.getElementById('tallyInput').value = '';
            logStatus(`Added local entry for ${key}. Click "Save to GitHub" when finished.`);
        }

        // --- STEP 3: SAVE TO GITHUB ---
        async function saveToGitHub() {
            if (!activePassphrase) {
                alert("App is locked.");
                return;
            }

            logStatus("Encrypting and saving to GitHub...");
            const encryptedPayload = encryptData(localTally, activePassphrase);
            const encodedContent = btoa(encryptedPayload);

            const url = `https://api.github.com/repos/${CONFIG.repo}/contents/${FILE_PATH}`;
            const bodyData = {
                message: `Update tally: ${new Date().toISOString()}`,
                content: encodedContent
            };
            if (currentSha) {
                bodyData.sha = currentSha;
            }

            try {
                const res = await fetch(url, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${CONFIG.token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(bodyData)
                });

                if (res.ok) {
                    const result = await res.json();
                    currentSha = result.content.sha;
                    logStatus("Successfully saved encrypted database to GitHub!");
                } else {
                    const errRes = await res.json();
                    logStatus("Failed to save: " + errRes.message);
                }
            } catch (err) {
                logStatus("Network Error: " + err.message);
            }
        }

        // --- STEP 4: FETCH & REVEAL ---
        async function fetchAndReveal() {
            if (!activePassphrase) {
                alert("App is locked.");
                return;
            }

            logStatus("Fetching encrypted database from GitHub...");
            const url = `https://api.github.com/repos/${CONFIG.repo}/contents/${FILE_PATH}`;

            try {
                const response = await fetch(url, {
                    headers: { "Authorization": `token ${CONFIG.token}` }
                });

                if (response.status === 404) {
                    logStatus("No database file found on GitHub yet.");
                    localTally = {};
                    currentSha = "";
                    document.getElementById('tallyDisplay').innerText = JSON.stringify(localTally, null, 2);
                    return;
                }

                const fileData = await response.json();
                currentSha = fileData.sha;
                
                const encryptedContent = atob(fileData.content);
                const decrypted = decryptData(encryptedContent, activePassphrase);

                if (decrypted) {
                    localTally = decrypted;
                    document.getElementById('tallyDisplay').innerText = JSON.stringify(localTally, null, 2);
                    logStatus("Successfully decrypted and revealed database.");
                } else {
                    logStatus("Failed to decrypt! Incorrect passphrase.");
                }
            } catch (err) {
                logStatus("API Error: " + err.message);
            }
        }
    </script>
</body>
</html>
